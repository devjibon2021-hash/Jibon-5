name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type (debug or release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java JDK
      - name: Setup Java JDK (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      # 4. Install Android SDK Packages
      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Accept Android SDK Licenses
      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      # 6. Setup Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # 7. Install Node Dependencies
      - name: Install Node Dependencies
        run: |
          npm install

      # 8. Build Web Application
      - name: Build Web Application
        run: |
          npm run build

      # 9. Sync Capacitor Android Platform
      - name: Sync Capacitor Android Platform
        run: |
          npx cap sync android

      # 10. Grant Gradle Execute Permission
      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x android/gradlew

      # 11. Build Android APK
      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd android

          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # 12. Prepare APK Artifact
      - name: Prepare APK Artifact
        shell: bash
        run: |
          set -e

          mkdir -p release-artifacts

          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk \
              release-artifacts/tuktukir-sangsar-debug.apk
          fi

          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
              release-artifacts/tuktukir-sangsar-release-unsigned.apk
          fi

          echo "Generated APK files:"
          ls -lh release-artifacts/

      # 13. Upload APK Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tuktukir-Sangsar-APK
          path: release-artifacts/*.apk
          retention-days: 30
